name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions: {}

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Validate Homebrew formula render (fixture)
        run: bash scripts/test-homebrew-formula-render.sh
      - uses: guitarrapc/actions/.github/actions/setup-dotnet@9122a18b0dea07585a242b9eb6ed7886f8587c49 # v1.0.1
        with:
          dotnet-version: 10.0.x
      - run: dotnet build -c Release
      - run: dotnet test -c Release --no-build

  ecosystem-matrix:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - id: matrix
        shell: pwsh
        run: |
          $manifest = Get-Content -Raw sandbox/ecosystems/manifest.json | ConvertFrom-Json
          $matrix = @{ include = @($manifest.ecosystems) } | ConvertTo-Json -Compress -Depth 4
          "matrix=$matrix" >> $env:GITHUB_OUTPUT

  ecosystem-smoke:
    needs: ecosystem-matrix
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.ecosystem-matrix.outputs.matrix) }}
    env:
      FIXTURE_ECOSYSTEM: ${{ matrix.ecosystem }}
      FIXTURE_PATH: ${{ matrix.path }}
      FIXTURE_PACKAGE: ${{ matrix.package }}
      FIXTURE_METADATA_SOURCE: ${{ matrix.metadataSource }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: guitarrapc/actions/.github/actions/setup-dotnet@9122a18b0dea07585a242b9eb6ed7886f8587c49 # v1.0.1
        with:
          dotnet-version: 10.0.x
      - name: Prepare fixture repository
        shell: pwsh
        run: ./sandbox/ci/Prepare-Ecosystem.ps1 -Path $env:FIXTURE_PATH
      - id: syft
        uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
      - name: Generate CycloneDX SBOM
        shell: pwsh
        run: '& "${{ steps.syft.outputs.cmd }}" "dir:$env:FIXTURE_PATH" -o "cyclonedx-json=$env:RUNNER_TEMP/ecosystem.cdx.json"'
      - run: dotnet restore Ol.slnx
      - run: dotnet build src/Ol/Ol.csproj -c Release --no-restore
      - name: Scan fixture repository
        shell: pwsh
        env:
          OL_GITHUB_TOKEN: ${{ github.token }}
        run: |
          $ol = "src/Ol/bin/Release/net10.0/ol.dll"
          function Invoke-OlScan([string] $InputPath, [string] $ReportPrefix) {
            dotnet $ol scan --input $InputPath --format text --quiet --retry 0 --cache-dir "$env:RUNNER_TEMP/ol-cache" > "$env:RUNNER_TEMP/$ReportPrefix.txt"
            dotnet $ol scan --input $InputPath --format markdown --quiet --retry 0 --cache-dir "$env:RUNNER_TEMP/ol-cache" > "$env:RUNNER_TEMP/$ReportPrefix.md"
            dotnet $ol scan --input $InputPath --format json --retry 0 --cache-dir "$env:RUNNER_TEMP/ol-cache" > "$env:RUNNER_TEMP/$ReportPrefix.json"
          }

          Invoke-OlScan "$env:RUNNER_TEMP/ecosystem.cdx.json" report
          ./sandbox/ci/Assert-EcosystemReport.ps1 -Report "$env:RUNNER_TEMP/report.json" -TextReport "$env:RUNNER_TEMP/report.txt" -MarkdownReport "$env:RUNNER_TEMP/report.md" -Ecosystem $env:FIXTURE_ECOSYSTEM -Package $env:FIXTURE_PACKAGE -MetadataSource $env:FIXTURE_METADATA_SOURCE -InputKind sbom -InputFormat cyclonedx

          # The package-manager input this fixture also scans, so the collection contract can be exercised on a
          # repository where an SBOM and a resolved input genuinely describe the same resolution.
          $combinedInput = $null
          $combinedPackageManagerReport = $null

          if ($env:FIXTURE_ECOSYSTEM -eq "nuget") {
            $assets = Join-Path $env:FIXTURE_PATH "obj/project.assets.json"
            $combinedInput = $assets
            $combinedPackageManagerReport = "nuget-assets-report"
            Invoke-OlScan $assets nuget-assets-report
            ./sandbox/ci/Assert-EcosystemReport.ps1 -Report "$env:RUNNER_TEMP/nuget-assets-report.json" -TextReport "$env:RUNNER_TEMP/nuget-assets-report.txt" -MarkdownReport "$env:RUNNER_TEMP/nuget-assets-report.md" -Ecosystem nuget -Package $env:FIXTURE_PACKAGE -MetadataSource $env:FIXTURE_METADATA_SOURCE -InputKind package-manager -InputFormat nuget-assets
          }

          if ($env:FIXTURE_ECOSYSTEM -eq "npm") {
            $pnpmLock = Join-Path $env:FIXTURE_PATH "pnpm/pnpm-lock.yaml"
            Invoke-OlScan $pnpmLock pnpm-lock-report
            ./sandbox/ci/Assert-EcosystemReport.ps1 -Report "$env:RUNNER_TEMP/pnpm-lock-report.json" -TextReport "$env:RUNNER_TEMP/pnpm-lock-report.txt" -MarkdownReport "$env:RUNNER_TEMP/pnpm-lock-report.md" -Ecosystem npm -Package is-odd -MetadataSource npm-registry -InputKind package-manager -InputFormat pnpm-lock

            $yarnBerryLock = Join-Path $env:FIXTURE_PATH "yarn-berry/yarn.lock"
            Invoke-OlScan $yarnBerryLock yarn-berry-lock-report
            ./sandbox/ci/Assert-EcosystemReport.ps1 -Report "$env:RUNNER_TEMP/yarn-berry-lock-report.json" -TextReport "$env:RUNNER_TEMP/yarn-berry-lock-report.txt" -MarkdownReport "$env:RUNNER_TEMP/yarn-berry-lock-report.md" -Ecosystem npm -Package is-odd -MetadataSource npm-registry -InputKind package-manager -InputFormat yarn-berry-lock
          }

          if ($env:FIXTURE_ECOSYSTEM -eq "composer") {
            $combinedInput = $env:FIXTURE_PATH
            $combinedPackageManagerReport = "composer-lock-report"
            Invoke-OlScan $env:FIXTURE_PATH composer-lock-report
            ./sandbox/ci/Assert-EcosystemReport.ps1 -Report "$env:RUNNER_TEMP/composer-lock-report.json" -TextReport "$env:RUNNER_TEMP/composer-lock-report.txt" -MarkdownReport "$env:RUNNER_TEMP/composer-lock-report.md" -Ecosystem composer -Package $env:FIXTURE_PACKAGE -MetadataSource $env:FIXTURE_METADATA_SOURCE -InputKind package-manager -InputFormat composer-lock
          }

          if ($env:FIXTURE_ECOSYSTEM -eq "gem") {
            $combinedInput = $env:FIXTURE_PATH
            $combinedPackageManagerReport = "bundler-lock-report"
            Invoke-OlScan $env:FIXTURE_PATH bundler-lock-report
            ./sandbox/ci/Assert-EcosystemReport.ps1 -Report "$env:RUNNER_TEMP/bundler-lock-report.json" -TextReport "$env:RUNNER_TEMP/bundler-lock-report.txt" -MarkdownReport "$env:RUNNER_TEMP/bundler-lock-report.md" -Ecosystem gem -Package $env:FIXTURE_PACKAGE -MetadataSource $env:FIXTURE_METADATA_SOURCE -InputKind package-manager -InputFormat bundler-lock
          }

          if ($env:FIXTURE_ECOSYSTEM -eq "maven") {
            $dependencyTree = Join-Path $env:FIXTURE_PATH "target/maven-dependency-tree.json"
            $combinedInput = $dependencyTree
            $combinedPackageManagerReport = "maven-dependency-tree-report"
            Invoke-OlScan $dependencyTree maven-dependency-tree-report
            ./sandbox/ci/Assert-EcosystemReport.ps1 -Report "$env:RUNNER_TEMP/maven-dependency-tree-report.json" -TextReport "$env:RUNNER_TEMP/maven-dependency-tree-report.txt" -MarkdownReport "$env:RUNNER_TEMP/maven-dependency-tree-report.md" -Ecosystem maven -Package $env:FIXTURE_PACKAGE -MetadataSource $env:FIXTURE_METADATA_SOURCE -InputKind package-manager -InputFormat maven-dependency-tree
          }

          if ($env:FIXTURE_ECOSYSTEM -eq "cocoapods") {
            Invoke-OlScan $env:FIXTURE_PATH cocoapods-lock-report
            ./sandbox/ci/Assert-EcosystemReport.ps1 -Report "$env:RUNNER_TEMP/cocoapods-lock-report.json" -TextReport "$env:RUNNER_TEMP/cocoapods-lock-report.txt" -MarkdownReport "$env:RUNNER_TEMP/cocoapods-lock-report.md" -Ecosystem cocoapods -Package $env:FIXTURE_PACKAGE -MetadataSource $env:FIXTURE_METADATA_SOURCE -InputKind package-manager -InputFormat cocoapods-lock
          }

          if ($null -ne $combinedInput) {
            dotnet $ol scan --input "$env:RUNNER_TEMP/ecosystem.cdx.json" --input $combinedInput --format json --retry 0 --cache-dir "$env:RUNNER_TEMP/ol-cache" > "$env:RUNNER_TEMP/combined-report.json"
            ./sandbox/ci/Assert-CombinedReport.ps1 -CombinedReport "$env:RUNNER_TEMP/combined-report.json" -SbomReport "$env:RUNNER_TEMP/report.json" -PackageManagerReport "$env:RUNNER_TEMP/$combinedPackageManagerReport.json"
          }
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ecosystem-${{ matrix.ecosystem }}
          path: |
            ${{ runner.temp }}/ecosystem.cdx.json
            ${{ runner.temp }}/report.txt
            ${{ runner.temp }}/report.md
            ${{ runner.temp }}/report.json
            ${{ runner.temp }}/nuget-assets-report.*
            ${{ runner.temp }}/pnpm-lock-report.*
            ${{ runner.temp }}/yarn-berry-lock-report.*
            ${{ runner.temp }}/composer-lock-report.*
            ${{ runner.temp }}/bundler-lock-report.*
            ${{ runner.temp }}/maven-dependency-tree-report.*
            ${{ runner.temp }}/cocoapods-lock-report.*
            ${{ runner.temp }}/combined-report.json

  self-scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: guitarrapc/actions/.github/actions/setup-dotnet@9122a18b0dea07585a242b9eb6ed7886f8587c49 # v1.0.1
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore Ol.slnx
      - run: dotnet build Ol.slnx -c Release --no-restore
      - name: Generate live self-scan
        shell: pwsh
        run: ./sandbox/Update-SelfScan.ps1 -NoBuild -OutputDirectory "$env:RUNNER_TEMP/live-self"
      - name: Verify live self-scan
        shell: pwsh
        run: |
          $output = "$env:RUNNER_TEMP/live-self"
          ./sandbox/ci/Assert-SelfScan.ps1 -Sbom "$output/ol.cdx.json" -Report "$output/ol.json"
          dotnet src/Ol/bin/Release/net10.0/ol.dll check --report "$output/ol.json" --allow-licenses MIT,Apache-2.0
          if ($LASTEXITCODE -ne 0) {
            throw "Live self-scan license policy failed."
          }
      - name: Regenerate golden self-scan reports
        shell: pwsh
        run: ./sandbox/Update-SelfScan.ps1 -NoBuild -ReportsOnly
      - name: Verify committed self-scan report snapshots
        shell: pwsh
        run: |
          $status = @(git status --porcelain -- sandbox/self/ol.txt sandbox/self/ol.md sandbox/self/ol.json)
          if ($status.Count -ne 0) {
            $status
            git diff -- sandbox/self/ol.txt sandbox/self/ol.md sandbox/self/ol.json
            throw "Regenerate and commit the updated self-scan report snapshots."
          }
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: ol-live-self-scan
          path: ${{ runner.temp }}/live-self

  build-complete:
    needs: [build, ecosystem-smoke, self-scan]
    permissions: {}
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    steps:
      - name: Build complete
        run: echo "All build jobs completed successfully."
