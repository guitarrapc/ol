name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing Git tag to release (e.g. v1.0.0). Must already exist on the remote."
        required: true
        type: string

permissions: {}

jobs:
  # Gate: validate version, run tests, verify generated data
  validate:
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Resolve tag ref
        id: ref
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            RAW="${TAG}"
            TAG="v${RAW#v}"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
        env:
          TAG: ${{ inputs.tag }}

      - name: Verify tag on remote (workflow_dispatch)
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${{ github.repository }}/git/ref/tags/${{ steps.ref.outputs.tag }}" --silent --fail \
            || { echo "::error::Tag '${{ steps.ref.outputs.tag }}' does not exist on the remote. Push it first, then re-run."; exit 1; }

      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          ref: ${{ steps.ref.outputs.tag }}

      - name: Verify version ↔ tag consistency
        id: version
        run: |
          set -euo pipefail
          TAG="${{ steps.ref.outputs.tag }}"
          # Extract version from Directory.Build.props
          PROPS_VERSION=$(grep -oP '(?<=<Version>)[^<]+' Directory.Build.props)
          TAG_VERSION="${TAG#v}"
          if [ "$PROPS_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::Version mismatch: Directory.Build.props has '$PROPS_VERSION' but tag is '$TAG' (expected '$TAG_VERSION')"
            exit 1
          fi
          echo "version=${PROPS_VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "### Version check passed" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Tag:** \`${TAG}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Version:** \`${PROPS_VERSION}\`" >> "$GITHUB_STEP_SUMMARY"

      - uses: guitarrapc/actions/.github/actions/setup-dotnet@9122a18b0dea07585a242b9eb6ed7886f8587c49 # v1.0.1
        with:
          dotnet-version: 10.0.x
      - run: dotnet build -c Release
      - name: Test
        run: dotnet test -c Release --no-build

  # Publish: multi-platform AOT binaries
  publish:
    needs: validate
    permissions:
      contents: read
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: ubuntu-24.04
            rid: linux-x64
            artifact: ol-linux-amd64
          - os: ubuntu-24.04-arm
            rid: linux-arm64
            artifact: ol-linux-arm64
          - os: windows-2025
            rid: win-x64
            artifact: ol-win-amd64
          - os: windows-11-arm
            rid: win-arm64
            artifact: ol-win-arm64
          - os: macos-26
            rid: osx-arm64
            artifact: ol-osx-arm64
          - os: macos-26-intel
            rid: osx-x64
            artifact: ol-osx-amd64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          ref: ${{ needs.validate.outputs.tag }}

      - uses: guitarrapc/actions/.github/actions/setup-dotnet@9122a18b0dea07585a242b9eb6ed7886f8587c49 # v1.0.1
        with:
          dotnet-version: 10.0

      - name: Publish (AOT)
        shell: bash
        run: |
          dotnet publish src/Ol/Ol.csproj -c Release -r ${{ matrix.rid }} -o publish/ -p:CopyOutputSymbolsToPublishDirectory=false -p:DebugType=none

      - name: Prepare release bundle
        shell: bash
        run: cp README.md LICENSE.md publish/

      - name: Create archive (Linux/macOS)
        if: ${{ runner.os != 'Windows' }}
        run: tar czf ../${{ matrix.artifact }}.tar.gz *
        working-directory: publish

      - name: Create archive (Windows)
        if: ${{ runner.os == 'Windows' }}
        shell: pwsh
        run: Compress-Archive -Path publish/* -DestinationPath ${{ matrix.artifact }}.zip

      - name: Upload artifact
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: ${{ matrix.artifact }}
          path: |
            ${{ matrix.artifact }}.tar.gz
            ${{ matrix.artifact }}.zip
          if-no-files-found: error

  # GHCR: linux/amd64 + linux/arm64 from published Linux AOT tarballs
  docker:
    needs: [validate, publish]
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout (Dockerfile)
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          ref: ${{ needs.validate.outputs.tag }}

      - name: GHCR image name (lowercase)
        id: ghcr
        run: echo "image=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Download all build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts/

      - name: Prepare multi-arch context
        run: |
          set -euo pipefail
          mkdir -p ctx/amd64 ctx/arm64
          AMD64_TGZ="$(find artifacts -name ol-linux-amd64.tar.gz -type f | head -1)"
          ARM64_TGZ="$(find artifacts -name ol-linux-arm64.tar.gz -type f | head -1)"
          test -n "$AMD64_TGZ" && test -n "$ARM64_TGZ"
          tar xzf "$AMD64_TGZ" -C ctx/amd64
          tar xzf "$ARM64_TGZ" -C ctx/arm64
          test -f ctx/amd64/ol && test -f ctx/arm64/ol
          chmod +x ctx/amd64/ol ctx/arm64/ol
          cp Dockerfile ctx/

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ./ctx
          file: ./ctx/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.ghcr.outputs.image }}:latest
            ${{ steps.ghcr.outputs.image }}:${{ needs.validate.outputs.version }}
            ${{ steps.ghcr.outputs.image }}:${{ needs.validate.outputs.tag }}

      - name: Image summary
        run: |
          echo "### GHCR image" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "${{ steps.ghcr.outputs.image }}:latest" >> "$GITHUB_STEP_SUMMARY"
          echo "${{ steps.ghcr.outputs.image }}:${{ needs.validate.outputs.version }}" >> "$GITHUB_STEP_SUMMARY"
          echo "${{ steps.ghcr.outputs.image }}:${{ needs.validate.outputs.tag }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

  # Release: create GitHub Release with checksums + SLSA attestation
  release:
    needs: [validate, publish]
    permissions:
      contents: write
      id-token: write
      attestations: write
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          ref: ${{ needs.validate.outputs.tag }}

      - name: Download all artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts/

      - name: Collect release assets and generate checksums
        run: |
          set -euo pipefail
          mkdir -p release
          find artifacts/ -type f \( -name '*.tar.gz' -o -name '*.zip' \) -exec cp {} release/ \;
          cd release
          sha256sum * > checksums-sha256.txt
          echo "### Release assets" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat checksums-sha256.txt >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Attest build provenance (SLSA)
        uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32 # v4.1.0
        with:
          subject-path: |
            release/*.tar.gz
            release/*.zip

      - name: Create GitHub Release
        run: |
          gh release create "$TAG" release/* --repo "$GITHUB_REPOSITORY" --title "v${VERSION}" --generate-notes --draft
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.validate.outputs.tag }}
          VERSION: ${{ needs.validate.outputs.version }}

  nuget-publish:
    name: Publish NuGet tool package
    needs: [validate, release]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          ref: ${{ needs.validate.outputs.tag }}

      - uses: guitarrapc/actions/.github/actions/setup-dotnet@9122a18b0dea07585a242b9eb6ed7886f8587c49 # v1.0.1
        with:
          dotnet-version: 10.0.x

      - name: Pack global tool
        shell: bash
        run: |
          set -euo pipefail
          dotnet pack src/Ol/Ol.csproj -c Release -o ./nupkg
          test -f nupkg/ol.*.nupkg

      - name: Verify global tool
        shell: bash
        run: |
          set -euo pipefail
          dotnet tool install --tool-path tool-test ol --version "${{ needs.validate.outputs.version }}" --add-source ./nupkg
          tool-test/ol --help

      - name: NuGet login (OIDC)
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1
        id: login
        with:
          user: ${{ secrets.SYNCED_NUGET_USER }}

      - name: Push to NuGet.org
        shell: bash
        run: |
          set -euo pipefail
          dotnet nuget push ./nupkg/*.nupkg --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate
          echo "### NuGet published" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Package:** \`ol\`" >> "$GITHUB_STEP_SUMMARY"
